name: .NET Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Check .NET SDK
        run: |
          which dotnet
          dotnet --version
          dotnet --list-sdks
          dotnet --info

      - name: Restore dependencies
        run: dotnet restore

      - name: Inspect MSBuild items
        run: |
          dotnet msbuild src/SFMSystem.API/API.csproj -getItem:Compile
          dotnet msbuild src/SFMSystem.API/API.csproj -getItem:Content
          dotnet msbuild src/SFMSystem.API/API.csproj -getItem:EmbeddedResource

      - name: Build
        run: dotnet build src/SFMSystem.API/API.csproj --no-restore

      - name: Test
        run: dotnet test
