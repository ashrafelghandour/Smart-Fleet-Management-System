name: .NET Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Check .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Clean generated files
        run: |
          find . -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +


      - name: Build
        run: dotnet build src/SFMSystem.API/API.csproj 

      - name: Test
        run: dotnet test
